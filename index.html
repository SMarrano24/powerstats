<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<section class="lock" id="lock" hidden>
  <form class="lock-card" id="lock-form" autocomplete="off">
    <img class="lock-icon" src="icon-180.png" alt="">
    <h1>PowerStats<span class="ver" data-version></span></h1>
    <p>Your grades are locked. Type your code to open them on this phone.</p>
    <div class="field">
      <input id="code" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Code" aria-label="Code">
      <button type="button" class="eye" id="eye">Show</button>
    </div>
    <label class="remember"><input type="checkbox" id="remember" checked> Remember on this phone</label>
    <button class="go" id="go" type="submit">Unlock</button>
    <p class="lock-msg" id="lock-msg" role="status"></p>
    <p class="lock-tip" id="lock-tip" hidden>After it opens, tap Share → Add to Home Screen. With Remember on, the icon opens without the code.</p>
  </form>
</section>

<div id="app" hidden>
  <header class="top"><div class="top-in">
    <button class="brand" data-act="top" aria-label="PowerStats, back to the top"><img src="icon-180.png" alt="">PowerStats<span class="ver" data-version></span></button>
    <button class="fresh" id="fresh" data-act="fresh"><i></i><span id="fresh-t"></span></button>
    <button class="ib" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div></header>
  <div class="pz-wrap" id="paused" hidden></div>
  <main id="view"></main>
</div>
